<!DOCTYPE html>
<html lang="en">

    <head>

        <!-- Metadata -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Skittles Tropical</title>
        
        <!-- Stylesheet for page -->
        <link rel="stylesheet" href="src/styles/style.css">

        <!-- Import Fonts (Fredoka and Poppins) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    </head>

    <body>

        <!-- Header -->
        <header class="site-header">
            <div class="container header-inner">
                <img class="logo-img" src="src/images/Logo.png" alt="Skittles logo">
                <span class="brand-text">Skittles</span>
            </div>
        </header>

        <main>


            <!-- Hero Section -->
            <section class="hero img-background">
                <div class="container hero-inner">

                    <div class="hero-card">

                        <!-- Left side-->
                        <div class="hero-text-block">
                            <p class="hero-subtitle">Taste the Rainbow</p>
                            <h1>Just a test</h1>
                            <h2 class="subheading">A subhead</h2>
                            <p class="hero-description">
                                Description of this delicious candy
                            </p>
                            <a class="btn btn-hero" href="#">Taste the rainbow</a>
                        </div>

                        <!-- Right side -->
                        <img class="hero-img" src="src/images/Sticker.jpg" alt="Skittles Sticker">

                    </div>
                </div>
            </section>


        </main>

        <footer class="site-footer">
            <div class="container footer-inner">

            </div>
        </footer>

    </body>

</html>
